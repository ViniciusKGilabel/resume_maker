services:
  app:
    build: .
    image: resume-maker:latest
    container_name: resume-maker
    init: true
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    volumes:
      # Volume nomeado: o usuário node do container consegue escrever sem ajustar permissões no host.
      - resume-data:/app/data
    extra_hosts:
      # Permite usar Ollama rodando no host via http://host.docker.internal:11434/v1
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  resume-data:
